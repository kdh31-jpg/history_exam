<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>한능검 기출노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 장의 문제지 카드 + 하단 고정 보기 버튼. 홈은 회차 요약 → 시대 필터 → 50문항 격자 */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#1d2624; --muted:#5d6b68; --line:#d9e0de;
  --accent:#2f7d70; --accent-soft:#e1efec; --good:#2f7d70; --bad:#b8402e; --bad-soft:#f7e4df;
  --hint:#8a6d1f; --sheet:#ffffff; --hint-soft:#f6efd9;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --paper:#1c2423; --ink:#e4ebe9; --muted:#9aa9a6; --line:#2e3a38;
  --accent:#6cc2b3; --accent-soft:#1f3632; --good:#6cc2b3; --bad:#ec8a78; --bad-soft:#3a2420;
  --hint:#e0c373; --hint-soft:#352e1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --paper:#1c2423; --ink:#e4ebe9; --muted:#9aa9a6; --line:#2e3a38;
  --accent:#6cc2b3; --accent-soft:#1f3632; --good:#6cc2b3; --bad:#ec8a78; --bad-soft:#3a2420;
  --hint:#e0c373; --hint-soft:#352e1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* home */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:8px 18px;border-bottom:1px solid var(--line)}
.hero h1{font-size:30px;line-height:1.25}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.pass{font-size:13px;color:var(--muted);margin-top:-8px}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec h2{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.cell.ok{background:var(--accent-soft);border-color:var(--good);color:var(--good);font-weight:700}
.cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.cell.dim{opacity:.3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.confirm{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top .meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:hidden}
.sheet img{display:block;width:100%;height:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 0;font-size:20px;font-family:var(--display)}
.opt.right{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.wrongpick{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav .btn{flex:1;padding:8px}
.result{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--display);font-size:22px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box h3{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.box.key{border-left:3px solid var(--accent)}
.box.tip{background:var(--hint-soft);border-color:transparent}
.box.tip h3{color:var(--hint)}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.wl li{display:flex;gap:8px}
.wl li b{font-family:var(--display);min-width:1.4em;color:var(--muted)}
.wl li.mine{color:var(--bad)} .wl li.mine b{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:20px}
@media (max-width:480px){.grid{gap:4px}.cell{font-size:11px;border-radius:4px}.hero h1{font-size:25px}.stat b{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.result{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.lede{margin:4px 0 0;color:var(--muted);font-size:14px}
.stat small{font-size:14px}
.sub{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.concept{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.concept h3{margin:0;font-family:var(--display);font-size:19px}
.c-head{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.c-era{color:var(--muted)}
.freq{padding:2px 8px;border-radius:4px;font-weight:700;font-size:12px}
.freq.hi{background:var(--bad-soft);color:var(--bad)}
.freq.mid{background:var(--hint-soft);color:var(--hint)}
.freq.lo{background:var(--accent-soft);color:var(--accent)}
.c-note{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink);opacity:.88}
.c-foot{display:flex;align-items:center;gap:10px;margin-top:4px}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.d{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.d.ok{background:var(--good)} .d.no{background:var(--bad)}
.c-prog{font-size:12px;color:var(--muted)}
.btn.sm{padding:6px 14px;font-size:13px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;font-size:13px}
.qmeta .tag{margin-right:0}
.src{color:var(--muted)}
.confirm{margin-top:18px}
.hist,.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.h-row,.r-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.h-row:hover,.r-row:hover{border-color:var(--accent)}
.h-main,.r-t{display:flex;flex-direction:column;flex:1;min-width:0}
.h-sub{font-size:12px;color:var(--muted)}
.h-score{font-family:var(--display);font-size:20px;font-weight:700}
.h-score.good{color:var(--good)} .h-score.mid{color:var(--hint)} .h-score.low{color:var(--bad)}
.h-wrong{font-size:12px;color:var(--muted);min-width:3.2em;text-align:right}
.h-open{font-size:12px;color:var(--hint);background:var(--hint-soft);padding:2px 8px;border-radius:4px}
.empty{color:var(--muted);font-size:14px;margin:0}
.r-n{width:1.6em;color:var(--muted);font-size:13px}
.r-mark{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px}
.r-row.ok .r-mark{background:var(--accent-soft);color:var(--good)}
.r-row.no .r-mark{background:var(--bad-soft);color:var(--bad)}
.r-row.no{border-color:var(--bad-soft)}
.r-t b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-pick{font-family:var(--display);font-size:15px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;margin:-4px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.hero h1.num{font-variant-numeric:tabular-nums}
.h-li{display:flex;gap:6px;align-items:stretch}
.h-li .h-row{flex:1;min-width:0;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.h-more{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:40px;flex:none;font-size:18px;color:var(--muted)}
.h-row.pinned{border-color:var(--accent);background:var(--accent-soft)}
.pin-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.sub-actions{margin-top:-4px}
#sheet{position:fixed;inset:0;z-index:50}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.sh-title{display:flex;flex-direction:column;padding:0 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sh-q{margin:4px 4px 6px;font-size:14px}
.sh-btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px;font-size:15px;font-weight:500;text-align:center}
.sh-btn.danger{color:var(--bad);border-color:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px)}to{transform:none}}}
.sheet img.loading{min-height:320px;background:var(--line)}</style>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden></div>
<script>
const EXAM = {
title: "제79회 한국사능력검정시험 심화",
year: 2026,
qs: [
{n:1,a:2,p:1,era:"선사·고조선",topic:"구석기 시대",key:"웅기 굴포리, 공주 석장리, 찍개·주먹도끼 → 구석기",why:"뗀석기(찍개·주먹도끼)를 쓴 구석기 사람들은 이동 생활을 하며 동굴이나 강가의 막집에서 살았다.",wrong:{1:"가락바퀴로 실 뽑기 → 신석기",3:"청동 방울을 의례 도구로 사용 → 청동기",4:"고인돌 축조 → 청동기",5:"빗살무늬 토기 → 신석기"},tip:"구석기 = 뗀석기·이동생활·동굴/막집 / 신석기 = 간석기·빗살무늬 토기·정착·농경 시작"},
{n:2,a:4,p:1,era:"선사·고조선",topic:"여러 나라의 성장",key:"(가) 영고·흰옷·형사취수 → 부여 / (나) 책화·족외혼·호랑이 숭배 → 동예",why:"동예는 단궁, 과하마, 반어피가 특산물로 유명했다.",wrong:{1:"소도(신성 지역) → 삼한",2:"범금 8조 → 고조선",3:"제가 회의 → 고구려",5:"1책 12법은 부여·고구려. 동예와는 관련 없음"},tip:"부여: 영고·사출도·1책12법 / 고구려: 동맹·제가회의·서옥제 / 옥저: 민며느리제·가족 공동무덤 / 동예: 무천·책화·족외혼"},
{n:3,a:2,p:2,era:"삼국",topic:"백제 무령왕",key:"삼근왕(13세 즉위, 2년 만에 사망) '이후' 백제 상황",why:"삼근왕 뒤 동성왕을 거쳐 즉위한 무령왕은 지방의 22담로에 왕족을 파견해 지방 통제를 강화했다.",wrong:{1:"고흥의 『서기』 → 근초고왕 (삼근왕 이전)",3:"평양성 공격, 고국원왕 전사 → 근초고왕",4:"마라난타의 불교 수용 → 침류왕",5:"광개토 대왕의 침입(58성 700촌 상실) → 아신왕"},tip:"웅진 천도(문주왕) → 삼근왕 → 동성왕(나제 결혼 동맹) → 무령왕(22담로) → 성왕(사비 천도)"},
{n:4,a:1,p:1,era:"삼국",topic:"금관가야",key:"김해 대성동 고분군, 김수로왕 건국 → 금관가야",why:"금관가야는 철이 풍부해 낙랑과 왜에 철을 수출하였다.",wrong:{2:"부경(창고) → 고구려",3:"활구(은병) → 고려",4:"벽란도 → 고려",5:"동시전(시장 감독) → 신라 지증왕"},tip:"금관가야: 김해·김수로·철 수출 / 대가야: 고령·후기 가야 연맹 주도"},
{n:5,a:2,p:3,era:"남북국",topic:"강수",key:"중원경 출신 문장가, 당 사신의 국서 해석, 태종 무열왕 → 강수",why:"강수는 외교 문서에 능해 「청방인문표」 등을 지었다.",wrong:{1:"『삼대목』(향가 모음) → 위홍·대구화상",3:"『왕오천축국전』 → 혜초",4:"「화왕계」 → 설총",5:"이두 정리 → 설총"},tip:"강수 = 외교 문서 / 설총 = 이두·화왕계 / 최치원 = 시무 10여 조·계원필경"},
{n:6,a:1,p:3,era:"삼국",topic:"부여 정림사지 오층 석탑",key:"당 소정방의 '평제탑' 글귀, '정림'이 새겨진 기와 → 정림사지 5층 석탑",why:"①이 부여 정림사지 오층 석탑이다. 미륵사지 석탑과 함께 백제를 대표하는 석탑이다.",wrong:{2:"경주 불국사 다보탑 (통일 신라)",3:"벽돌 모양의 전탑 계열 (통일 신라)",4:"구례 화엄사 사사자 삼층 석탑 (통일 신라)",5:"고려 시대 다층 석탑"},tip:"백제 석탑: 익산 미륵사지 석탑, 부여 정림사지 오층 석탑"},
{n:7,a:3,p:1,era:"남북국",topic:"발해",key:"숙신·예맥·옥저·고구려의 옛 땅에 상경·중경·동경·남경·서경 → 발해 5경",why:"발해는 인안(무왕), 대흥(문왕) 등 독자적인 연호를 사용했다.",wrong:{1:"골품제 → 신라",2:"정사암 회의 → 백제",4:"진대법 → 고구려 고국천왕",5:"기인 제도 → 고려 태조"},tip:"발해: 5경 15부 62주, 3성 6부(정당성·선조성·중대성), 주자감, 해동성국"},
{n:8,a:2,p:2,era:"남북국",topic:"국학",key:"신문왕 2년 설치, 예부 소속 → 국학",why:"통일 신라의 국학에는 박사와 조교를 두어 유학을 교육했다.",wrong:{1:"전국 부·목·군·현에 설치 → 조선 향교",3:"전문 강좌 7재 → 고려 국자감(예종)",4:"양현고 → 고려 예종",5:"생원·진사 입학 자격 → 조선 성균관"},tip:"국학(신문왕) → 태학감(경덕왕) / 독서삼품과(원성왕)는 이 시험 방식"},
{n:9,a:5,p:2,era:"남북국",topic:"궁예",key:"양길의 부하, 철원 도읍, 국호 태봉 → 궁예",why:"궁예는 광평성을 비롯한 정치 기구를 설치했다.",wrong:{1:"공산 전투 전사 → 신숭겸 (고려 장수)",2:"경주 사심관 → 김부(경순왕)",3:"후당·오월에 사신 파견 → 견훤",4:"일리천 전투에서 신검 격파 → 왕건"},tip:"궁예: 송악 → 철원 천도, 후고구려 → 마진 → 태봉, 광평성"},
{n:10,a:3,p:2,era:"남북국",topic:"신라 하대",key:"(가) 김지정의 난, 혜공왕 피살(780) / (나) 장보고의 딸 왕비 문제로 반란(846)",why:"김헌창의 난(822, 헌덕왕)이 그 사이에 일어났다.",wrong:{1:"견훤의 후백제 건국 → 900년",2:"원광 걸사표 → 진평왕(608)",4:"최치원 시무 10여 조 → 진성 여왕(894)",5:"김춘추 즉위 → 654년"},tip:"신라 하대 순서: 혜공왕 피살 → 김헌창의 난 → 장보고의 난 → 원종·애노의 난 → 최치원 시무책"},
{n:11,a:5,p:2,era:"고려",topic:"고려 문화유산",key:"청주 흥덕사, 직지심체요절 → 고려",why:"흥덕사에서 직지심체요절이 간행된 (가)는 고려다. ⑤ 상감 청자 주전자가 고려의 문화유산이다.",wrong:{1:"금동 삼존불 → 삼국 시대",2:"금관 → 신라",3:"금동 연가 7년명 여래 입상 → 고구려",4:"금동 대향로 → 백제"},tip:"직지심체요절(1377) = 현존 세계 최고 금속 활자본, 청주 흥덕사"},
{n:12,a:5,p:2,era:"고려",topic:"고려의 경제",key:"숙종 때 해동통보·중보·삼한통보 주조, 『송사』 → 고려",why:"고려에는 특수 행정 구역인 소가 있어 여러 수공업 물품을 생산했다.",wrong:{1:"솔빈부의 말 → 발해",2:"담배·면화 상품 작물 → 조선 후기",3:"덕대 → 조선 후기 광산",4:"중강 개시·후시 → 조선 후기"},tip:"고려 화폐: 건원중보(성종), 삼한통보·해동통보·활구(숙종)"},
{n:13,a:1,p:3,era:"고려",topic:"고려 현종",key:"강조의 정변으로 즉위, 나주 몽진, 귀주 대첩 → 현종",why:"현종 때 거란의 침입을 불력으로 막으려 초조대장경 조판을 시작했다.",wrong:{2:"최승로 시무 28조 → 성종",3:"별무반 → 숙종",4:"만부교 사건 → 태조",5:"광덕·준풍 연호 → 광종"},tip:"현종: 초조대장경, 5도 양계 정비, 나성 축조, 연등회·팔관회 부활"},
{n:14,a:3,p:2,era:"고려",topic:"고려 중기",key:"(가) 이자겸의 난(1126) / (나) 보현원 무신정변(1170)",why:"김부식이 묘청의 서경 천도 운동(1135)을 진압했다.",wrong:{1:"최우의 정방 → 1225",2:"쌍기의 과거제 건의 → 광종(958)",4:"만적의 난 → 1198",5:"서희의 외교 담판 → 993"},tip:"이자겸의 난(1126) → 묘청의 난(1135) → 무신정변(1170)"},
{n:15,a:3,p:2,era:"고려",topic:"삼국유사",key:"승려 일연, 왕력·기이·흥법 등 9편, 향가 수록 → 『삼국유사』",why:"『삼국유사』에는 단군의 고조선 건국 이야기가 기록되어 있다.",wrong:{1:"기전체 → 『삼국사기』",2:"남북국 용어 첫 사용 → 유득공 『발해고』",4:"고구려 시조 일대기 서사시 → 이규보 「동명왕편」",5:"상대·중대·하대 구분 → 『삼국사기』"},tip:"단군 기록: 『삼국유사』, 『제왕운기』, 『세종실록지리지』, 『동국통감』"},
{n:16,a:3,p:1,era:"고려",topic:"원 간섭기",key:"원의 사신 탑납과 공녀·응방 → 원 간섭기",why:"원 간섭기에는 지배층을 중심으로 변발과 호복 등 몽골풍이 유행했다.",wrong:{1:"서얼 통청 운동 → 조선 후기",2:"정감록 유포 → 조선 후기",4:"망이·망소이의 난 → 무신 집권기(1176)",5:"흑창 → 태조"},tip:"원 간섭기: 정동행성, 응방, 결혼도감, 몽골풍·고려양, 권문세족"},
{n:17,a:4,p:2,era:"고려",topic:"위화도 회군",key:"우왕과 이별하는 최영, 요동 정벌 실패 → 위화도 회군(1388)",why:"위화도 회군은 쌍성총관부 탈환(1356)과 과전법 제정(1391) 사이인 (라)에 해당한다.",wrong:{1:"(가) 최충헌 집권기",2:"(나) 강화 천도~원 간섭",3:"(다) 일본 원정 이후",5:"(마) 조선 건국 이후"},tip:"공민왕 반원 개혁(1356) → 위화도 회군(1388) → 과전법(1391) → 조선 건국(1392)"},
{n:18,a:5,p:3,era:"고려",topic:"이색",key:"서천 문헌서원, 원 과거 합격, 문하시중, 『목은집』 → 이색",why:"이색은 성균관 대사성이 되어 정몽주 등을 학관으로 천거했다.",wrong:{1:"『화랑세기』 『고승전』 → 김대문",2:"『삼국사기』 → 김부식",3:"『불씨잡변』 → 정도전",4:"예안 향약 → 이황"},tip:"이색(목은) — 정몽주, 정도전, 권근을 길러낸 성리학자"},
{n:19,a:5,p:2,era:"조선 전기",topic:"세종",key:"집현전, 사가독서제, 『삼강행실도』 → 세종",why:"세종 때 한양 기준 역법서인 『칠정산 내편』을 간행했다.",wrong:{1:"주자소, 계미자 → 태종",2:"『동의보감』 → 광해군 때 허준",3:"『대전통편』 → 정조",4:"『국조오례의』 완성 → 성종"},tip:"세종: 집현전, 훈민정음, 칠정산, 농사직설, 4군 6진, 공법(전분6등·연분9등)"},
{n:20,a:4,p:2,era:"조선 전기",topic:"관수관급제",key:"직전법의 폐단(수조권 남용) 해결 정책",why:"성종 때 관청이 세금을 거두어 관리에게 지급하는 관수관급제를 실시했다.",wrong:{1:"역분전 → 고려 태조",2:"공음전 → 고려 문종",3:"녹과전 → 고려 원종",5:"전시과 → 고려"},tip:"과전법(공양왕) → 직전법(세조) → 관수관급제(성종) → 직전법 폐지(명종)"},
{n:21,a:2,p:1,era:"조선 후기",topic:"조선 후기 사회",key:"전기수(소설 읽어주는 사람), 상평통보 → 조선 후기",why:"조선 후기에는 부산 초량 왜관에서 일본과 교역하는 상인을 볼 수 있다.",wrong:{1:"주자감 → 발해",3:"팔관회 외국 사신 → 고려",4:"제위보 → 고려",5:"빈공과 → 신라 6두품"},tip:"조선 후기: 상평통보 유통, 전기수·판소리, 왜관 무역(내상), 송상·만상"},
{n:22,a:4,p:3,era:"조선 후기",topic:"광해군 대외 관계",key:"(가) 7년 전쟁 끝남(임진왜란 직후) / (나) 후금과 화친 후 강화도 → 정묘호란(1627)",why:"광해군 때 강홍립 부대가 명의 요청으로 사르후 전투(1619)에 참전했다.",wrong:{1:"김윤후 처인성 → 몽골 침입(1232)",2:"남이의 여진족 정벌 → 세조",3:"권율의 행주대첩 → 임진왜란(1593)",5:"김준룡 광교산 → 병자호란(1637)"},tip:"임진왜란(1592~98) → 사르후 전투(1619) → 인조반정(1623) → 정묘호란(1627) → 병자호란(1636)"},
{n:23,a:4,p:2,era:"조선 후기",topic:"영조",key:"청계천 준설, 균역법 → 영조",why:"영조 즉위 초 이인좌 등 소론 강경파가 난을 일으켰다(1728).",wrong:{1:"장용영 → 정조",2:"예송 → 현종",3:"백두산정계비 → 숙종",5:"나선 정벌(신류) → 효종"},tip:"영조: 탕평비, 균역법, 청계천 준설, 『속대전』, 신문고 부활"},
{n:24,a:3,p:2,era:"조선 전기",topic:"승정원",key:"왕명을 관원에게 전달하는 문서 '유지' 발급 → 승정원",why:"승정원은 은대, 후원이라고도 불렸다.",wrong:{1:"『내각일력』 → 규장각",2:"을묘왜변 계기 상설 → 비변사",4:"대제학, 경연 → 홍문관",5:"서경권 → 사헌부·사간원(양사)"},tip:"승정원 = 왕의 비서 기관, 『승정원일기』"},
{n:25,a:1,p:3,era:"조선 후기",topic:"홍대용",key:"『을병연행록』, 천주교·천문학 대화 『유포문답』 → 홍대용",why:"홍대용은 『의산문답』에서 무한 우주론을 주장했다.",wrong:{2:"「양반전」 → 박지원",3:"『북학의』 소비 촉진 → 박제가",4:"「지구전요」 → 최한기",5:"『고금석림』 → 이의봉"},tip:"홍대용: 지전설·무한 우주론, 혼천의 제작, 『담헌서』"},
{n:26,a:3,p:2,era:"조선 후기",topic:"역관",key:"외국과 통할 때 말을 전함, 통역 → 역관",why:"역관은 『노걸대』 등을 교재로 외국어를 공부했다.",wrong:{1:"신량역천 → 조례·나장 등",2:"감사·방백 → 관찰사",4:"매매·상속 대상 → 노비",5:"춘추관 사초 → 사관"},tip:"역관은 중인. 사행 무역으로 부를 쌓음"},
{n:27,a:1,p:1,era:"조선 후기",topic:"홍경래의 난",key:"서북민 차별, 가산 군수 정시 사망, 정주성 → 홍경래의 난(1811)",why:"홍경래의 난은 홍경래, 우군칙 등이 주도했다.",wrong:{2:"청군 파병 → 임오군란, 동학 농민 운동",3:"집강소 → 동학 농민 운동",4:"공주 피란 → 이괄의 난",5:"박규수 안핵사 → 임술 농민 봉기(1862)"},tip:"홍경래의 난(1811, 평안도) / 임술 농민 봉기(1862, 진주, 삼정이정청)"},
{n:28,a:5,p:1,era:"근대",topic:"프랑스",key:"병인박해 20년 후 조약(1886), 천주교 선교 자유 → 프랑스",why:"프랑스는 병인양요 때 외규장각 도서를 약탈했다.",wrong:{1:"거문도 점령 → 영국",2:"용암포 조차 → 러시아",3:"운산 금광 → 미국",4:"제너럴 셔먼호 → 미국"},tip:"병인박해(1866) → 병인양요(1866, 외규장각) → 조불 수호 통상 조약(1886)"},
{n:29,a:1,p:2,era:"근대",topic:"임오군란",key:"구식 군인 봉기, 일본 공사관 습격, 중전 생사 불명 → 임오군란(1882)",why:"임오군란의 결과 일본과 제물포 조약이 체결되었다.",wrong:{2:"13도 창의군 → 정미의병(1907)",3:"입헌 군주제 목표 → 갑신정변",4:"척화비 → 신미양요 이후",5:"황사영 백서 → 신유박해(1801)"},tip:"임오군란 결과: 제물포 조약(일본), 조청 상민 수륙 무역 장정(청)"},
{n:30,a:2,p:2,era:"근대",topic:"통리기무아문",key:"개화 정책 총괄, 청에 영선사 파견 → 통리기무아문",why:"통리기무아문은 5군영을 무위영·장어영 2영으로 개편했다.",wrong:{1:"이범윤 간도 관리사 → 대한 제국",3:"『동국문헌비고』 → 영조",4:"23부 → 2차 갑오개혁",5:"대한국 국제 → 광무개혁"},tip:"통리기무아문(1880): 12사, 별기군, 2영, 영선사·조사 시찰단"},
{n:31,a:2,p:3,era:"근대",topic:"2차 갑오개혁",key:"군국기무처(1차 갑오개혁) → (가) → 태양력·건양(을미개혁)",why:"2차 갑오개혁 때 교육입국 조서와 한성 사범 학교 관제가 반포되었다.",wrong:{1:"톈진 조약 → 1885",3:"독립신문 → 1896",4:"경부선 → 1905",5:"원산 학사 → 1883"},tip:"1차 갑오(군국기무처) → 2차 갑오(홍범 14조, 8아문→7부, 교육입국 조서) → 을미개혁(단발령, 태양력)"},
{n:32,a:1,p:2,era:"근대",topic:"한일 의정서",key:"'군사 전략상 필요한 지점 차지' → 한일 의정서(1904)",why:"러일 전쟁 발발 직후 일본이 한일 의정서를 강요했다.",wrong:{2:"고종 강제 퇴위 → 1907",3:"군대 해산 → 1907",4:"화폐 정리 사업 → 1905",5:"일진회 합방 청원 → 1909"},tip:"한일 의정서(1904.2) → 1차 한일 협약(1904.8, 고문 정치) → 을사늑약(1905)"},

  <section class="sec"><h2>문항별 결과</h2>
    <ol class="rlist">${s.ids.map((id,i)=>{const q=it(id);const ok=s.picks[id]===q.a;
      return `<li><button class="r-row ${ok?"ok":"no"}" data-i="${i}"><span class="r-n num">${i+1}</span><span class="r-mark">${ok?"정답":"오답"}</span><span class="r-t"><b>${esc(q.topic)}</b><span class="h-sub num">제${q.r}회 ${q.n}번 · ${q.era}</span></span><span class="r-pick num">${ok?MARK[q.a]:`${MARK[s.picks[id]]||"-"} → ${MARK[q.a]}`}</span></button></li>`}).join("")}</ol>
  </section>`;
  $("#back").onclick=()=>{S.tab="rand";S.sess=null;home();window.scrollTo(0,0)};
  if($("#x-retry"))$("#x-retry").onclick=()=>playSession(newSession(shuffle(wrong),s.scope,"retry"),0);
  $("#x-again").onclick=()=>playSession(newSession(shuffle(s.ids),s.scope,"again"),0);
  if($("#x-rev"))$("#x-rev").onclick=()=>reviewSession(s,wrong,0);
  $("#x-all").onclick=()=>reviewSession(s,s.ids,0);
  document.querySelectorAll(".r-row").forEach(b=>b.onclick=()=>reviewSession(s,s.ids,+b.dataset.i));
}

/* ---------- 문제 풀이 ---------- */
function start(list,id){S.sess=null;S.review=false;S.list=list;S.idx=Math.max(0,list.indexOf(id));S.view="quiz";quiz();window.scrollTo(0,0)}
function quiz(){
  const q=it(S.list[S.idx]);const sess=S.sess;
  const pick=sess?sess.picks[q.id]:S.ans[q.id];const done=!!pick;
  const last=S.idx>=S.list.length-1;
  const backLabel=sess?(S.review?"← 결과":"← 그만 풀기"):"← 목록";
  $("#app").innerHTML=`
  <div class="top"><button class="btn ghost" id="back">${backLabel}</button><span class="meta num">${sess&&!S.review?"랜덤 ":""}${S.idx+1} / ${S.list.length} · ${q.p}점</span></div>
  ${sess&&!S.review?`<div class="prog"><i style="width:${Math.round(Object.keys(sess.picks).length/sess.ids.length*100)}%"></i></div>`:""}
  <div class="qmeta"><span class="tag">${q.era}</span><span class="src num">제${q.r}회 ${q.n}번</span>${q.hot?`<span class="src">· ${esc(q.hot)}</span>`:""}</div>
  <div class="sheet"><img id="qimg" alt="제${q.r}회 ${q.n}번 문제"></div>
  ${done?`<div class="result">
    <div class="verdict ${pick===q.a?"ok":"no"}">${pick===q.a?"정답이에요":`오답이에요 · 정답은 ${MARK[q.a]}`}</div>
    <div class="box key"><h3>핵심 단서</h3><div>${esc(q.key)}</div></div>
    <div class="box"><h3>정답 ${MARK[q.a]}</h3><div>${esc(q.why)}</div></div>
    <div class="box"><h3>오답 풀이</h3><ul class="wl">${[1,2,3,4,5].filter(i=>i!==q.a).map(i=>`<li class="${i===pick?"mine":""}"><b>${MARK[i]}</b><span>${esc(q.wrong[i]||"")}</span></li>`).join("")}</ul></div>
    <div class="box tip"><h3>${q.hot&&q.r!==79?"이 개념 핵심 정리":"함께 외울 것"}</h3><div>${esc(q.tip)}</div></div>
    ${sess?"":`<div class="actions"><button class="btn ghost" id="retry">이 문제 다시 풀기</button></div>`}
  </div>`:""}`;
  showImg(q);
  const bar=$("#bar");bar.hidden=false;
  const nextLabel=!last?"다음":sess&&!S.review?(sess.fin?"결과 보기":"안 푼 문제로"):sess?"결과로":"목록으로";
  bar.innerHTML=`<div class="bar-in"><div class="opts">${[1,2,3,4,5].map(i=>`<button class="opt ${done&&i===q.a?"right":""} ${done&&i===pick&&pick!==q.a?"wrongpick":""}" data-i="${i}" ${done?"disabled":""} aria-label="${i}번 선택">${MARK[i]}</button>`).join("")}</div>
  <div class="nav"><button class="btn ghost" id="prev" ${S.idx?"":"disabled"}>이전</button><button class="btn" id="next">${nextLabel}</button></div></div>`;
  fitPad();
  bar.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.i;S.ans[q.id]=v;
    if(sess){sess.picks[q.id]=v;if(Object.keys(sess.picks).length>=sess.ids.length)sess.fin=true}
    save();quiz();const r=document.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"start"})});
  $("#back").onclick=()=>{if(sess&&S.review)sessResult(sess);else if(sess){S.tab="rand";S.sess=null;home()}else home();window.scrollTo(0,0)};
  $("#prev").onclick=()=>{S.idx--;quiz();window.scrollTo(0,0)};
  $("#next").onclick=()=>{if(!last){S.idx++;quiz();window.scrollTo(0,0)}else if(sess){if(!S.review&&!sess.fin){const i=sess.ids.findIndex(id=>!sess.picks[id]);S.idx=i;quiz()}else sessResult(sess);window.scrollTo(0,0)}else{home();window.scrollTo(0,0)}};
  if($("#retry"))$("#retry").onclick=()=>{delete S.ans[q.id];save();quiz()};
}
home();
</script>
</body></html>
